<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Current portal · Attendance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#334155}a:hover{color:#0f172a}
</style>
</helmet>
<div style="min-height: 100vh; background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #0f172a">
  <header style="border-bottom: 1px solid #e2e8f0; background: #ffffff">
    <div style="max-width: 1152px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 16px 24px; box-sizing: border-box">
      <span style="font-family: ui-serif, Georgia, Cambria, 'Times New Roman', serif; font-size: 18px; color: #0f172a">greenwood-academy</span>
      <nav style="display: flex; flex-wrap: wrap; gap: 4px">
        <button type="button" style="border: 0; border-radius: 9999px; padding: 6px 16px; font: inherit; font-size: 14px; color: #475569; background: transparent">📊 Dashboard</button>
        <button type="button" style="border: 0; border-radius: 9999px; padding: 6px 16px; font: inherit; font-size: 14px; color: #475569; background: transparent">👥 People</button>
        <button type="button" style="border: 0; border-radius: 9999px; padding: 6px 16px; font: inherit; font-size: 14px; color: #475569; background: transparent">🔐 Roles &amp; Powers</button>
        <button type="button" style="border: 0; border-radius: 9999px; padding: 6px 16px; font: inherit; font-size: 14px; color: #475569; background: transparent">🌳 Hierarchy</button>
        <button type="button" style="border: 0; border-radius: 9999px; padding: 6px 16px; font: inherit; font-size: 14px; font-weight: 500; color: #ffffff; background: #2563eb">✅ Attendance</button>
      </nav>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 12px">
        <span style="font-size: 14px; color: #475569">Asha Verma</span>
        <button type="button" style="border: 1px solid #cbd5e1; border-radius: 9999px; padding: 6px 16px; font: inherit; font-size: 14px; color: #334155; background: #ffffff">Sign out</button>
      </div>
    </div>
  </header>

  <div style="max-width: 1152px; margin: 0 auto; padding: 32px 24px; box-sizing: border-box">
    <div style="margin-bottom: 24px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div>
        <p style="margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.2em; color: #94a3b8">Daily</p>
        <h1 style="margin: 4px 0 0; font-family: ui-serif, Georgia, Cambria, 'Times New Roman', serif; font-size: 30px; font-weight: 400; color: #0f172a">Attendance</h1>
      </div>
      <label style="font-size: 14px">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Date</span>
        <input type="text" value="24/11/2026" style="border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 14px; width: 140px">
      </label>
    </div>

    <div style="overflow: hidden; border: 1px solid #e2e8f0; border-radius: 12px; background: #ffffff">
      <table style="width: 100%; border-collapse: collapse; font-size: 14px">
        <thead>
          <tr style="border-bottom: 1px solid #e2e8f0">
            <th style="padding: 12px 20px; text-align: left; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b">Person</th>
            <th style="padding: 12px 20px; text-align: left; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b">Mark</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="11">
            <tr style="border-bottom: 1px solid #f1f5f9">
              <td style="padding: 12px 20px">
                <div style="color: #0f172a">{{r.name}} <span style="font-size: 12px; color: #94a3b8">{{r.you}}</span></div>
                <div style="font-size: 12px; color: #64748b">{{r.code}} · {{r.role}}</div>
              </td>
              <td style="padding: 12px 20px">
                <div style="display: flex; flex-wrap: wrap; gap: 4px">
                  <sc-for list="{{r.opts}}" as="o" hint-placeholder-count="5">
                    <button type="button" style="border: 1px solid {{o.bd}}; border-radius: 4px; padding: 4px 8px; font: inherit; font-size: 12px; font-weight: 500; background: {{o.bg}}; color: {{o.fg}}">{{o.label}}</button>
                  </sc-for>
                </div>
              </td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const styles = {
      PRESENT: { label: 'Present', bd: '#86efac', bg: '#dcfce7', fg: '#166534' },
      LATE: { label: 'Late', bd: '#fcd34d', bg: '#fef3c7', fg: '#92400e' },
      HALF_DAY: { label: 'Half day', bd: '#fdba74', bg: '#ffedd5', fg: '#9a3412' },
      LEAVE: { label: 'Leave', bd: '#93c5fd', bg: '#dbeafe', fg: '#1e40af' },
      ABSENT: { label: 'Absent', bd: '#fca5a5', bg: '#fee2e2', fg: '#991b1b' }
    };
    const order = ['PRESENT', 'LATE', 'HALF_DAY', 'LEAVE', 'ABSENT'];
    const people = [
      ['Asha Verma', 'ADMIN001', 'Principal', 'PRESENT', true],
      ['Dr. Richard Thompson', 'PRIN001', 'Principal', 'PRESENT'],
      ['Ms. Sarah Johnson', 'VP001', 'Vice Principal', 'PRESENT'],
      ['Prof. James Wilson', 'REG001', 'Registrar', 'LATE'],
      ['Dr. Emily Davis', 'HOD001', 'Head of Department', ''],
      ['Mrs. Lisa Brown', 'HOD002', 'Head of Department', 'LEAVE'],
      ['Mr. Robert Miller', 'CC001', 'Class Coordinator', 'PRESENT'],
      ['Ms. Jennifer Lee', 'FAC001', 'Faculty', ''],
      ['Mr. David Martinez', 'FAC002', 'Faculty', ''],
      ['Alice Brown', 'STU001', 'Student', 'ABSENT'],
      ['Bob Smith', 'STU002', 'Student', '']
    ];
    const rows = people.map((p) => ({
      name: p[0],
      code: p[1],
      role: p[2],
      you: p[4] ? '(you)' : '',
      opts: order.map((s) => {
        const on = p[3] === s;
        return {
          label: styles[s].label,
          bd: on ? styles[s].bd : '#e2e8f0',
          bg: on ? styles[s].bg : '#ffffff',
          fg: on ? styles[s].fg : '#64748b'
        };
      })
    }));
    return { rows };
  }
}
</script>
</body>
</html>
